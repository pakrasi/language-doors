<script>
/* The B1 trainer moved to Fluentish. Any #b1… link (bookmarks, the Home Screen icon, an old tab after its update)
   goes to /fluentish/ with the hash unchanged; Fluentish's router maps the old Igloo hash to its own route.
   Drill, Test, Look up and Write stay here until Fluentish has them. Nothing in localStorage is read or written,
   and the service worker stays registered (it keeps Drill offline). */
(function () {
  var B1 = /^#\/?b1(?![\w-])/;
  function moved() {
    if (!B1.test(location.hash)) return false;
    location.replace('/fluentish/#' + location.hash.replace(/^#\/?/, ''));
    return true;
  }
  if (moved()) { window.B1_MOVED = true; return; }
  addEventListener('hashchange', function (e) { if (moved()) e.stopImmediatePropagation(); }, true);
})();
/* Apply the saved theme before first paint. */
(function () { try { var p = JSON.parse(localStorage.getItem('doors.prefs.v2')) || {}; document.documentElement.dataset.theme = p.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {} })();
/* The old Framework page is now "How it works" on the homepage. */
if (/^#\/?(framework|how)\b/.test(location.hash)) location.replace('index.html#how');
</script>
